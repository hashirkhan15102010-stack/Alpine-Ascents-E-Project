<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Alpine Ascents | Expedition Card</title>
</head>
<style>
    body {
        background: #f5f4f0;
        padding: 40px 16px;
    }

    .expedition-card {
        max-width: 440px;
        margin: 0 auto;
        border: 1px solid #e6e3df;
        background: #fff;
        box-shadow: 0 16px 32px rgb(16 45 67 / 8%);
    }

    .expedition-card img {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: cover;
    }

    .card-text {
        color: #172b3e;
    }
</style>
<body>
    <div class="card expedition-card">
        <img src="../Image/image.jpg" alt="Mountain expedition in the high alpine region">
        <div class="card-body">
            <h5 class="card-title">The Summit Expedition</h5>
            <p class="card-text">Experience world-class guiding, safety-focused planning and unforgettable alpine routes across the globe.</p>
            <a href="index.html" class="btn btn-primary btn-lg">Learn More</a>
        </div>
    </div>
</body>
</html>
